<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Bất Phương Trình Bậc Nhất</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* Hiệu ứng trượt mượt mà cho vùng nhập liệu */
        #dataPanelWrapper {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
            max-height: 2000px; /* Đủ lớn để chứa nhiều hàng */
            opacity: 1;
            overflow: hidden;
        }
        #dataPanelWrapper.collapsed {
            max-height: 0;
            opacity: 0;
            margin-top: 0;
            margin-bottom: 0;
        }

        input:focus { outline: none; }
        canvas { touch-action: none; cursor: crosshair; }
        
        .tool-btn.active {
            background-color: #eff6ff; 
            color: #2563eb; 
            border-color: #bfdbfe; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <div class="max-w-6xl mx-auto w-full p-4 md:p-6 flex flex-col gap-5 flex-grow">

        <!-- 1. VÙNG DỮ LIỆU ĐỘNG (Có thể thu gọn) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col shrink-0 transition-all">
            <!-- Header -->
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center z-10 rounded-t-xl">
                <h1 class="text-lg md:text-xl font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                    Hệ Bất Phương Trình
                </h1>
                <button id="toggleBtn" class="flex items-center gap-2 px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg border border-slate-300 transition-colors shadow-sm">
                    <span id="toggleText">Thu gọn</span>
                    <svg id="toggleIcon" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </button>
            </div>

            <!-- Content Panel -->
            <div id="dataPanelWrapper">
                <div class="p-4 md:p-5 flex flex-col gap-4">
                    <!-- Hướng dẫn -->
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-3 text-sm text-blue-800 flex items-start md:items-center gap-2">
                        <svg class="w-5 h-5 flex-shrink-0 mt-0.5 md:mt-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>Nhập các bất phương trình. Kéo thả điểm <strong>M(x,y)</strong> trên đồ thị để kiểm tra trực tiếp tọa độ ở cột phải.</span>
                    </div>

                    <!-- Container chứa danh sách BPT -->
                    <div class="flex flex-col gap-3" id="inputsContainer">
                        <!-- Hàng dữ liệu sẽ sinh động ở đây -->
                    </div>

                    <!-- Nút Thêm BPT -->
                    <div>
                        <button id="addEqBtn" class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold rounded-lg border border-blue-200 transition-colors text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                            Thêm bất phương trình
                        </button>
                    </div>
                </div>
            </div>
        </div>


        <!-- 2. KHU VỰC ĐỒ THỊ -->
        <div class="flex flex-col gap-2 shrink-0">
            
            <!-- THANH CÔNG CỤ -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-2 flex flex-wrap items-center justify-between gap-3">
                
                <div class="flex items-center gap-1.5 bg-slate-50 p-1 rounded-lg border border-slate-200">
                    <button id="toolPointerBtn" class="tool-btn active flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                        Kéo Điểm M
                    </button>
                    <button id="toolPanBtn" class="tool-btn flex items-center gap-1.5 px-3 py-1.5 rounded text-sm font-medium text-slate-600 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                        Di Chuyển
                    </button>
                </div>

                <div class="flex items-center gap-4 md:gap-6">
                    <!-- Zoom Controls -->
                    <div class="flex items-center gap-0.5 bg-slate-50 p-1 rounded-lg border border-slate-200">
                        <button id="zoomOutBtn" class="p-1 rounded hover:bg-slate-200 text-slate-700 transition-colors" title="Thu nhỏ">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                        </button>
                        <span class="text-xs font-bold text-slate-500 px-1 uppercase">Zoom</span>
                        <button id="zoomInBtn" class="p-1 rounded hover:bg-slate-200 text-slate-700 transition-colors" title="Phóng to">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>

                    <!-- Slider Cỡ Chữ -->
                    <div class="flex items-center gap-2">
                        <label for="fontSlider" class="text-xs font-bold text-slate-500 uppercase tracking-wide hidden sm:block">Cỡ chữ</label>
                        <input type="range" id="fontSlider" min="10" max="36" value="16" class="w-20 md:w-24 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer outline-none focus:ring-2 focus:ring-blue-300">
                        <span id="fontValue" class="text-xs font-mono font-medium text-slate-700 w-8">16px</span>
                    </div>
                </div>
            </div>

            <!-- VÙNG BẢN VẼ (16:9 Cố định) -->
            <div class="relative w-full aspect-video bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">
                <canvas id="mathCanvas" class="absolute inset-0 w-full h-full block"></canvas>
            </div>

            <!-- Chú thích -->
            <div class="flex items-center justify-center gap-6 text-sm text-slate-500 bg-white p-2 rounded-lg border border-slate-200 shadow-sm mt-1">
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 bg-white border border-slate-400 rounded-sm"></div>
                    <span>Miền nghiệm</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-4 h-4 border border-slate-400 rounded-sm" style="background: repeating-linear-gradient(45deg, #cbd5e1, #cbd5e1 1px, transparent 1px, transparent 4px);"></div>
                    <span>Bị gạch bỏ (sai)</span>
                </div>
            </div>
        </div>

        <!-- 3. FOOTER -->
        <div class="text-center text-sm font-medium text-slate-500 pb-6 shrink-0 pt-2">
            Bản quyền: Dlk Edu Tech - Phát triển bởi tranhongdan@tranphudlk.edu.vn
        </div>

    </div>


    <script>
        // --- State Variables ---
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const inputsContainer = document.getElementById('inputsContainer');
        
        let W = 0, H = 0; 
        let scale = 50; 
        let offsetX = 0, offsetY = 0; 
        let canvasFontSize = 16;
        
        let currentMode = 'POINTER'; 
        let isDragging = false;
        let lastMouse = {x: 0, y: 0};
        
        // Quản lý dữ liệu đầu vào động (bắt đầu với 1 BPT)
        let equationsData = ["x + y <= 4"];
        let parsedEquations = [];
        let intersections = [];
        let pointM = { x: 2, y: 1 };
        
        // Bảng màu quay vòng
        const lineColors = ['#475569', '#7c3aed', '#0284c7', '#ea580c', '#e11d48', '#16a34a', '#d946ef'];
        let hatchPatterns = [];

        // --- Giao diện Động (Dynamic Inputs) ---
        function renderInputRows() {
            inputsContainer.innerHTML = '';
            
            equationsData.forEach((eqStr, index) => {
                const row = document.createElement('div');
                row.className = "flex flex-col md:flex-row gap-2 md:gap-3 w-full group";
                
                // Nút Xóa (chỉ hiện nếu có nhiều hơn 1 BPT)
                const deleteBtnHtml = equationsData.length > 1 
                    ? `<button onclick="removeEquation(${index})" class="text-slate-300 hover:text-red-500 px-2 transition-colors focus:outline-none" title="Xóa">
                           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                       </button>`
                    : `<div class="w-9"></div>`; // Cân bằng layout nếu không có nút xóa

                row.innerHTML = `
                    <div class="w-full md:w-1/2 flex items-center bg-white border border-slate-300 rounded-lg overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-200 shadow-sm transition-shadow">
                        <div class="bg-slate-100 text-slate-500 font-bold px-3 border-r border-slate-200 text-sm h-full flex items-center justify-center min-w-[40px]">
                            ${index + 1}
                        </div>
                        <input type="text" id="eqInput_${index}" value="${eqStr}" oninput="handleInputChage(${index})" class="w-full px-3 py-2.5 text-slate-800 font-bold placeholder-slate-300 bg-transparent text-sm md:text-base" placeholder="Nhập BPT...">
                        ${deleteBtnHtml}
                    </div>
                    
                    <div class="w-full md:w-1/2">
                        <div id="eqValid_${index}" class="w-full h-full flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 text-slate-400 overflow-hidden min-h-[46px] transition-colors shadow-sm">
                            <span class="truncate text-sm">Trống</span>
                        </div>
                    </div>
                `;
                inputsContainer.appendChild(row);
            });
            
            // Re-evalute hệ thống sau khi render xong
            updateSystem();
        }

        function handleInputChage(index) {
            const val = document.getElementById(`eqInput_${index}`).value;
            equationsData[index] = val;
            updateSystem(); // Cập nhật tính toán và vẽ lại ngay khi gõ
        }

        window.removeEquation = function(index) {
            equationsData.splice(index, 1);
            renderInputRows();
        }

        document.getElementById('addEqBtn').addEventListener('click', () => {
            equationsData.push(""); // Thêm một hàng trống
            renderInputRows();
            
            // Focus vào ô input mới nhất
            setTimeout(() => {
                const newIdx = equationsData.length - 1;
                const input = document.getElementById(`eqInput_${newIdx}`);
                if (input) input.focus();
            }, 50);
        });


        // --- Thu gọn / Mở rộng ---
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const panel = document.getElementById('dataPanelWrapper');
        let isCollapsed = false;
        
        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                panel.classList.add('collapsed');
                toggleText.textContent = "Mở rộng";
                toggleIcon.style.transform = 'rotate(-180deg)';
            } else {
                panel.classList.remove('collapsed');
                toggleText.textContent = "Thu gọn";
                toggleIcon.style.transform = 'rotate(0deg)';
            }
        });

        // --- Toán học & Canvas Utilities ---
        function mathToPxX(x) { return (W / 2 + offsetX) + x * scale; }
        function mathToPxY(y) { return (H / 2 + offsetY) - y * scale; } 
        function pxToMathX(px) { return (px - (W / 2 + offsetX)) / scale; }
        function pxToMathY(py) { return ((H / 2 + offsetY) - py) / scale; }

        function parseEqStr(str, idx) {
            str = str.replace(/\s+/g, ''); 
            if (!str) return null;
            
            const match = str.match(/(.*?)(<=|>=|<|>)(.*)/);
            if (!match) return null;
            let op = match[2];
            
            function parseSide(s) {
                let a = 0, b = 0, c = 0;
                if (!s) return {a, b, c};
                let terms = s.replace(/-/g, '+-').split('+');
                for (let t of terms) {
                    if (!t) continue;
                    if (t.includes('x')) {
                        let val = t.replace('x', '');
                        a += (val === '' || val === '+') ? 1 : (val === '-') ? -1 : (parseFloat(val) || 0);
                    } else if (t.includes('y')) {
                        let val = t.replace('y', '');
                        b += (val === '' || val === '+') ? 1 : (val === '-') ? -1 : (parseFloat(val) || 0);
                    } else {
                        c += (parseFloat(t) || 0);
                    }
                }
                return { a, b, c };
            }
            
            let lhs = parseSide(match[1]);
            let rhs = parseSide(match[3]);
            
            let A = lhs.a - rhs.a;
            let B = lhs.b - rhs.b;
            let C = lhs.c - rhs.c;

            if (Math.abs(A) < 1e-9 && Math.abs(B) < 1e-9) return null;
            return { A, B, C, op, idx };
        }

        function calculateSystem() {
            parsedEquations = [];
            equationsData.forEach((str, i) => {
                let eq = parseEqStr(str, i);
                if (eq) parsedEquations.push(eq);
            });
            
            // Giao điểm bằng quy tắc Cramer
            intersections = [];
            for (let i = 0; i < parsedEquations.length; i++) {
                for (let j = i + 1; j < parsedEquations.length; j++) {
                    let eq1 = parsedEquations[i], eq2 = parsedEquations[j];
                    let D = eq1.A * eq2.B - eq2.A * eq1.B;
                    let Dx = (-eq1.C) * eq2.B - (-eq2.C) * eq1.B;
                    let Dy = eq1.A * (-eq2.C) - eq2.A * (-eq1.C);
                    
                    if (Math.abs(D) > 1e-9) { 
                        let ix = Dx / D, iy = Dy / D;
                        let isDuplicate = intersections.some(pt => Math.hypot(pt.x - ix, pt.y - iy) < 1e-4);
                        if (!isDuplicate) intersections.push({x: ix, y: iy});
                    }
                }
            }
        }


        function initHatching() {
            hatchPatterns = [];
            const dpr = window.devicePixelRatio || 1;
            
            lineColors.forEach(color => {
                const pc = document.createElement('canvas');
                const step = 5; // Khoảng cách gạch 5px
                pc.width = step * dpr; 
                pc.height = step * dpr; 
                const pCtx = pc.getContext('2d');
                
                pCtx.scale(dpr, dpr);
                pCtx.strokeStyle = color;
                pCtx.lineWidth = 0.4; // Nét siêu mảnh 0.4px
                
                pCtx.beginPath();
                pCtx.moveTo(0, 0); 
                pCtx.lineTo(step, 0);
                pCtx.stroke();
                
                const pat = ctx.createPattern(pc, 'repeat');
                if (window.DOMMatrix) pat.setTransform(new DOMMatrix().scale(1/dpr, 1/dpr));
                hatchPatterns.push(pat);
            });
        }

        function drawCanvas() {
            if(hatchPatterns.length === 0) initHatching();
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            
            let startX = Math.floor(pxToMathX(0));
            let endX = Math.ceil(pxToMathX(W));
            let startY = Math.floor(pxToMathY(H));
            let endY = Math.ceil(pxToMathY(0));  
            
            // Lưới mờ
            ctx.strokeStyle = '#e2e8f0'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = startX; i <= endX; i++) { 
                let px = mathToPxX(i); 
                ctx.moveTo(px, 0); ctx.lineTo(px, H); 
            }
            for(let i = startY; i <= endY; i++) { 
                let py = mathToPxY(i); 
                ctx.moveTo(0, py); ctx.lineTo(W, py); 
            }
            ctx.stroke();

            // Trục tọa độ
            ctx.strokeStyle = '#334155'; 
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let ox = mathToPxX(0), oy = mathToPxY(0);
            if (ox > 0 && ox < W) { ctx.moveTo(ox, 0); ctx.lineTo(ox, H); }
            if (oy > 0 && oy < H) { ctx.moveTo(0, oy); ctx.lineTo(W, oy); }
            ctx.stroke();

            // Số và chữ trên trục
            ctx.fillStyle = '#334155';
            ctx.font = `500 ${canvasFontSize}px Inter`; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for(let i = startX; i <= endX; i++) {
                if(i === 0) continue;
                let px = mathToPxX(i);
                if (px > 0 && px < W && oy > 0 && oy < H) {
                    ctx.fillText(i, px, oy + canvasFontSize + 4);
                    ctx.beginPath(); ctx.moveTo(px, oy-4); ctx.lineTo(px, oy+4); ctx.stroke();
                }
            }
            for(let i = startY; i <= endY; i++) {
                if(i === 0) continue;
                let py = mathToPxY(i);
                if (py > 0 && py < H && ox > 0 && ox < W) {
                    ctx.fillText(i, ox - canvasFontSize - 4, py);
                    ctx.beginPath(); ctx.moveTo(ox-4, py); ctx.lineTo(ox+4, py); ctx.stroke();
                }
            }

            if (ox > -50 && ox < W+50 && oy > -50 && oy < H+50) {
                ctx.fillStyle = '#0f172a';
                ctx.font = `800 ${canvasFontSize + 2}px Inter`;
                ctx.fillText('O', ox - (canvasFontSize + 2), oy + (canvasFontSize + 2));
                
                ctx.beginPath(); ctx.moveTo(ox-5, 12); ctx.lineTo(ox, 0); ctx.lineTo(ox+5, 12); ctx.fill();
                ctx.fillText('y', ox + (canvasFontSize + 4), canvasFontSize + 4);
                
                ctx.beginPath(); ctx.moveTo(W-12, oy-5); ctx.lineTo(W, oy); ctx.lineTo(W-12, oy+5); ctx.fill();
                ctx.fillText('x', W - (canvasFontSize + 4), oy + (canvasFontSize + 6));
            }

            // Vẽ các đường biên và miền gạch sọc
            parsedEquations.forEach(eq => {
                let { A, B, C, op, idx } = eq;
                const FAR = 10000;
                let p1, p2;
                if (Math.abs(B) > 1e-7) {
                    p1 = { x: -FAR, y: (-C - A * (-FAR)) / B };
                    p2 = { x: FAR, y: (-C - A * FAR) / B };
                } else {
                    p1 = { x: -C / A, y: -FAR };
                    p2 = { x: -C / A, y: FAR };
                }

                let nx = A, ny = B;
                if (op === '<=' || op === '<') { nx = A; ny = B; } 
                else { nx = -A; ny = -B; } 
                
                let len = Math.hypot(nx, ny);
                nx /= len; ny /= len;

                let p3 = { x: p2.x + nx * FAR, y: p2.y + ny * FAR };
                let p4 = { x: p1.x + nx * FAR, y: p1.y + ny * FAR };

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(mathToPxX(p1.x), mathToPxY(p1.y));
                ctx.lineTo(mathToPxX(p2.x), mathToPxY(p2.y));
                ctx.lineTo(mathToPxX(p3.x), mathToPxY(p3.y));
                ctx.lineTo(mathToPxX(p4.x), mathToPxY(p4.y));
                ctx.closePath();
                ctx.clip(); 

                ctx.fillStyle = hatchPatterns[idx % hatchPatterns.length];
                ctx.translate(W/2 + offsetX, H/2 + offsetY);
                let angle = (idx * 30 + 45) * Math.PI / 180; 
                ctx.rotate(angle);
                let diag = Math.hypot(W, H) * 2;
                ctx.fillRect(-diag, -diag, diag*2, diag*2); 
                ctx.restore(); 

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(mathToPxX(p1.x), mathToPxY(p1.y));
                ctx.lineTo(mathToPxX(p2.x), mathToPxY(p2.y));
                if (op === '<' || op === '>') ctx.setLineDash([12, 10]); 
                
                ctx.strokeStyle = lineColors[idx % lineColors.length];
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
            });

            // Vẽ giao điểm
            ctx.textBaseline = 'bottom';
            intersections.forEach(pt => {
                let px = mathToPxX(pt.x), py = mathToPxY(pt.y);
                if (px < -30 || px > W + 30 || py < -30 || py > H + 30) return;

                ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();

                let txt = `(${parseFloat(pt.x.toFixed(2))}, ${parseFloat(pt.y.toFixed(2))})`;
                ctx.font = `600 ${canvasFontSize}px Inter`;
                ctx.textAlign = pt.x >= 0 ? 'right' : 'left';
                let off = pt.x >= 0 ? -10 : 10;
                
                ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.strokeText(txt, px + off, py - 8);
                ctx.fillStyle = '#0f172a';
                ctx.fillText(txt, px + off, py - 8);
            });

            // Vẽ điểm M
            let mx = mathToPxX(pointM.x), my = mathToPxY(pointM.y);
            ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; 
            ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();

            ctx.font = `800 ${canvasFontSize + 2}px Inter`;
            ctx.textAlign = 'left';
            let mTxt = `M(${parseFloat(pointM.x.toFixed(1))}, ${parseFloat(pointM.y.toFixed(1))})`;
            ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.strokeText(mTxt, mx + 14, my - 10);
            ctx.fillStyle = '#b91c1c';
            ctx.fillText(mTxt, mx + 14, my - 10);
        }

        // Cập nhật kết quả thay số
        function updateValidationBoxes() {
            equationsData.forEach((str, i) => {
                let box = document.getElementById(`eqValid_${i}`);
                if (!box) return; // Bảo vệ nếu DOM chưa kịp render
                
                str = str.trim();
                if (!str) {
                    box.innerHTML = `<span class="truncate text-sm">Trống</span>`;
                    box.className = "w-full h-full flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 text-slate-400 overflow-hidden";
                    return;
                }

                let eq = parsedEquations.find(e => e.idx === i);
                if (!eq) {
                    box.innerHTML = `<span class="text-rose-500 font-bold text-sm">Lỗi cú pháp</span>`;
                    box.className = "w-full h-full flex items-center bg-rose-50 border border-rose-200 rounded-lg px-4 py-2.5 overflow-hidden";
                    return; 
                }

                let val = eq.A * pointM.x + eq.B * pointM.y + eq.C;
                let valid = false;
                if (eq.op === '<=') valid = val <= 1e-6;
                if (eq.op === '>=') valid = val >= -1e-6;
                if (eq.op === '<') valid = val < -1e-6;
                if (eq.op === '>') valid = val > 1e-6;

                let escOp = eq.op.replace('<', '&lt;').replace('>', '&gt;');
                
                let expr = "";
                if (eq.A !== 0) expr += `${parseFloat(eq.A.toFixed(2))}(<b class="text-slate-800">${parseFloat(pointM.x.toFixed(1))}</b>) `;
                if (eq.B !== 0) {
                    let sign = eq.B > 0 ? '+' : '-';
                    expr += expr ? ` ${sign} ` : (eq.B < 0 ? "-" : "");
                    expr += `${Math.abs(parseFloat(eq.B.toFixed(2)))}(<b class="text-slate-800">${parseFloat(pointM.y.toFixed(1))}</b>) `;
                }
                if (eq.C !== 0) {
                    let sign = eq.C > 0 ? '+' : '-';
                    expr += expr ? ` ${sign} ` : (eq.C < 0 ? "-" : "");
                    expr += `${Math.abs(parseFloat(eq.C.toFixed(2)))} `;
                }
                if (!expr) expr = "0 ";

                let icon = valid 
                    ? `<div class="text-emerald-600 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`
                    : `<div class="text-rose-600 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>`;

                box.innerHTML = `
                    <div class="truncate text-slate-600 font-mono pr-2 text-xs sm:text-sm">
                        ${expr} = <strong class="text-slate-900">${parseFloat(val.toFixed(2))}</strong> 
                        <span class="text-blue-600 font-black px-1">${escOp}</span> 0
                    </div>
                    ${icon}
                `;
                
                box.className = valid
                    ? "w-full h-full flex items-center justify-between bg-emerald-50 border border-emerald-300 rounded-lg px-4 py-2.5 overflow-hidden shadow-sm transition-colors"
                    : "w-full h-full flex items-center justify-between bg-rose-50 border border-rose-300 rounded-lg px-4 py-2.5 overflow-hidden shadow-sm transition-colors";
            });
        }

        function updateSystem() {
            calculateSystem();
            drawCanvas();
            updateValidationBoxes();
        }

        // --- Sự kiện Toolbar & Tương tác Canvas ---
        const btnPointer = document.getElementById('toolPointerBtn');
        const btnPan = document.getElementById('toolPanBtn');
        
        btnPointer.addEventListener('click', () => {
            currentMode = 'POINTER';
            btnPointer.classList.add('active'); btnPan.classList.remove('active');
            canvas.style.cursor = 'crosshair';
        });
        btnPan.addEventListener('click', () => {
            currentMode = 'PAN';
            btnPan.classList.add('active'); btnPointer.classList.remove('active');
            canvas.style.cursor = 'grab';
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => { scale *= 1.2; drawCanvas(); });
        document.getElementById('zoomOutBtn').addEventListener('click', () => { scale /= 1.2; drawCanvas(); });

        const fontSlider = document.getElementById('fontSlider');
        const fontValue = document.getElementById('fontValue');
        fontSlider.addEventListener('input', (e) => {
            canvasFontSize = parseInt(e.target.value);
            fontValue.textContent = `${canvasFontSize}px`;
            drawCanvas();
        });

        function handleResize() {
            const wrapper = canvas.parentElement;
            const rect = wrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            W = rect.width * dpr;
            H = rect.height * dpr;
            canvas.width = W;
            canvas.height = H;
            
            if(hatchPatterns.length > 0) initHatching(); // Vẽ lại pattern theo pixel ratio mới
            drawCanvas();
        }
        
        const ro = new ResizeObserver(handleResize);
        ro.observe(canvas.parentElement);

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            let cx = e.clientX, cy = e.clientY;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) * dpr, y: (cy - rect.top) * dpr };
        }

        function onPointerDown(e) {
            isDragging = true;
            lastMouse = getEventPos(e);
            
            if (currentMode === 'POINTER') {
                const px = mathToPxX(pointM.x), py = mathToPxY(pointM.y);
                if (Math.hypot(lastMouse.x - px, lastMouse.y - py) > 40) isDragging = false; 
            } else {
                canvas.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) {
                if (currentMode === 'POINTER') {
                    const pos = getEventPos(e);
                    const px = mathToPxX(pointM.x), py = mathToPxY(pointM.y);
                    canvas.style.cursor = (Math.hypot(pos.x - px, pos.y - py) < 40) ? 'pointer' : 'crosshair';
                }
                return;
            }
            
            const pos = getEventPos(e);
            if (currentMode === 'PAN') {
                offsetX += (pos.x - lastMouse.x);
                offsetY += (pos.y - lastMouse.y);
                drawCanvas();
            } else if (currentMode === 'POINTER') {
                pointM.x = pxToMathX(pos.x);
                pointM.y = pxToMathY(pos.y);
                drawCanvas();
                updateValidationBoxes(); 
            }
            lastMouse = pos;
        }

        function onPointerUp() {
            isDragging = false;
            canvas.style.cursor = currentMode === 'PAN' ? 'grab' : 'crosshair';
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: true});
        window.addEventListener('touchmove', onPointerMove, {passive: true});
        window.addEventListener('touchend', onPointerUp);

        // --- Khởi chạy ---
        window.onload = () => {
            renderInputRows(); // Tạo DOM động lần đầu
            handleResize(); // Lấy size và vẽ lần đầu
        };
    </script>
</body>
</html>
