<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Bất Phương Trình Bậc Nhất - MAKE MATH EZ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { 
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* Hiệu ứng trượt cho Panel */
        #dataPanelWrapper {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease, margin 0.3s ease;
            max-height: 2500px;
            opacity: 1;
            overflow: hidden;
        }
        #dataPanelWrapper.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
        }

        input:focus { outline: none; }
        canvas { 
            touch-action: none; /* Tránh cuộn trang khi vuốt trên canvas */
            cursor: crosshair; 
        }
        
        .tool-btn.active {
            background-color: #dbeafe; 
            color: #1d4ed8; 
            border-color: #bfdbfe; 
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <div class="max-w-6xl mx-auto w-full p-4 md:p-6 flex flex-col gap-4 flex-grow">

        <!-- 1. VÙNG DỮ LIỆU ĐỘNG (Phía trên) -->

            <!-- Header Panel -->
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center rounded-t-xl">

                    <span class="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-lg transform -rotate-3">&Sigma;</span>
                    MAKE MATH EZ
                    <span class="hidden md:inline text-slate-400 font-medium text-sm ml-2 font-normal tracking-normal border-l border-slate-300 pl-3">Hệ Bất Phương Trình</span>
                </h1>
                <button id="toggleBtn" class="flex items-center gap-2 px-3 py-1.5 bg-white hover:bg-slate-100 text-slate-600 text-sm font-semibold rounded-lg border border-slate-300 transition-colors shadow-sm">
                    <span id="toggleText">Thu gọn</span>

                </button>
            </div>

            <!-- Wrapper ẩn/hiện -->
            <div id="dataPanelWrapper">
                <div class="p-4 md:p-5 flex flex-col gap-4">
                    <!-- Grid Titles (Chỉ hiện trên desktop) -->
                    <div class="hidden md:flex gap-3 px-2 text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <div class="w-1/2">Nhập BPT</div>
                        <div class="w-1/2">Kiểm tra tọa độ M(x,y)</div>
                    </div>

                    <!-- Container danh sách BPT -->
                    <div class="flex flex-col gap-3" id="inputsContainer">
                        <!-- JS sẽ render HTML vào đây -->
                    </div>

                    <!-- Nút Thêm BPT -->
                    <div class="pt-2">
                        <button id="addEqBtn" class="flex items-center gap-2 px-5 py-2.5 bg-blue-50 text-blue-700 hover:bg-blue-100 font-semibold rounded-lg border border-blue-200 transition-all text-sm shadow-sm hover:shadow active:scale-95">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                            Thêm bất phương trình
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. VÙNG THANH CÔNG CỤ (Nằm ngang phía trên bản vẽ) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-wrap items-center justify-between gap-4 z-0">
            <!-- Công cụ tương tác -->
            <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="toolPointerBtn" class="tool-btn active flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-semibold text-slate-600 transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                    <span class="hidden sm:inline">Kéo Điểm M</span>
                </button>
                <button id="toolPanBtn" class="tool-btn flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-semibold text-slate-600 transition-colors shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5v-1a1.5 1.5 0 013 0v1m0 0V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11"></path></svg>
                    <span class="hidden sm:inline">Di Chuyển</span>
                </button>
            </div>

            <!-- Công cụ tùy chỉnh -->
            <div class="flex flex-wrap items-center gap-4 sm:gap-6">
                <!-- Zoom -->
                <div class="flex items-center gap-0.5 bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button id="zoomOutBtn" class="p-1 rounded hover:bg-slate-200 text-slate-700 transition-colors" title="Thu nhỏ">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
                    </button>
                    <span class="text-xs font-bold text-slate-500 px-2 uppercase">Zoom</span>
                    <button id="zoomInBtn" class="p-1 rounded hover:bg-slate-200 text-slate-700 transition-colors" title="Phóng to">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                </div>

                <!-- Slider Cỡ Chữ -->
                <div class="flex items-center gap-2">
                    <label class="text-xs font-bold text-slate-500 uppercase hidden md:block">Cỡ chữ</label>
                    <svg class="w-4 h-4 text-slate-400 md:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path></svg>
                    <input type="range" id="fontSlider" min="10" max="36" value="16" class="w-16 sm:w-24 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer outline-none focus:ring-2 focus:ring-blue-400">
                </div>

                <!-- Slider Nét Gạch -->
                <div class="flex items-center gap-2 pl-4 border-l border-slate-200">
                    <label class="text-xs font-bold text-slate-500 uppercase hidden lg:block">Nét gạch</label>
                    <svg class="w-4 h-4 text-slate-400 lg:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    <input type="range" id="hatchSlider" min="0.1" max="4.0" step="0.1" value="0.4" class="w-16 sm:w-24 h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer outline-none focus:ring-2 focus:ring-blue-400">
                </div>
            </div>
        </div>

        <!-- 3. VÙNG BẢN VẼ (Cố định 16:9) -->
        <div class="relative w-full aspect-video bg-white rounded-xl shadow-md border border-slate-300 overflow-hidden shrink-0 z-0">
            <canvas id="mathCanvas" class="absolute inset-0 w-full h-full block bg-white"></canvas>
            
            <!-- Chú thích nổi nhẹ dưới cùng góc phải -->
            <div class="absolute bottom-3 right-3 flex flex-col gap-1.5 text-xs font-medium text-slate-600 bg-white/90 backdrop-blur p-2 rounded-lg border border-slate-200 shadow-sm pointer-events-none">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-white border border-slate-400 rounded-sm"></div>
                    <span>Miền nghiệm</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 border border-slate-400 rounded-sm" style="background: repeating-linear-gradient(45deg, #94a3b8, #94a3b8 1px, transparent 1px, transparent 4px);"></div>
                    <span>Bị gạch bỏ</span>
                </div>
            </div>
        </div>

        <!-- 4. FOOTER -->
        <footer class="text-center py-4 mt-2 border-t border-slate-200">
            <p class="text-sm font-semibold text-slate-500">
                Bản quyền: Dlk Edu Tech - Phát triển bởi tranhongdan@tranphudlk.edu.vn
            </p>
        </footer>

    </div>

    <script>
        // --- CÁC BIẾN TRẠNG THÁI (STATE) ---
        const canvas = document.getElementById('mathCanvas');
        const ctx = canvas.getContext('2d');
        const inputsContainer = document.getElementById('inputsContainer');
        
        let W = 0, H = 0; 
        let scale = 50; 
        let offsetX = 0, offsetY = 0; 
        let canvasFontSize = 16;
        let hatchWeight = 0.4; // Độ đậm nét gạch sọc mặc định
        
        let currentMode = 'POINTER'; // 'POINTER' | 'PAN'
        let isDragging = false;
        let lastMouse = {x: 0, y: 0};
        
        // Quản lý Dữ liệu BPT
        let equationsData = ["x + y <= 4"]; // Mặc định có 1 BPT
        let parsedEquations = [];
        let intersections = [];
        let pointM = { x: 2, y: 1 };
        
        // Cấu hình màu sắc
        const lineColors = ['#334155', '#6d28d9', '#0369a1', '#c2410c', '#be123c', '#15803d', '#a21caf'];
        let hatchPatterns = [];

        // --- GIAO DIỆN ĐỘNG (Render Inputs & Validation) ---
        function renderInputRows() {
            inputsContainer.innerHTML = '';
            
            equationsData.forEach((eqStr, index) => {
                const row = document.createElement('div');
                row.className = "flex flex-col md:flex-row gap-2 md:gap-3 w-full group";
                
                // Nút Xóa (chỉ hiển thị nếu > 1 dòng)
                const deleteBtnHtml = equationsData.length > 1 
                    ? `<button onclick="removeEquation(${index})" class="text-slate-300 hover:text-rose-500 px-3 transition-colors focus:outline-none" title="Xóa BPT">
                           <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                       </button>`
                    : `<div class="w-11"></div>`; // Cân bằng không gian

                row.innerHTML = `
                    <div class="w-full md:w-1/2 flex items-center bg-white border border-slate-300 rounded-lg overflow-hidden focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-200 shadow-sm transition-all h-[46px]">
                        <div class="bg-slate-100 text-slate-500 font-bold px-3 border-r border-slate-200 text-sm h-full flex items-center justify-center min-w-[44px]">
                            ${index + 1}
                        </div>
                        <input type="text" id="eqInput_${index}" value="${eqStr}" oninput="handleInputChage(${index})" class="w-full px-3 py-2 text-slate-800 font-bold placeholder-slate-300 bg-transparent text-sm md:text-base outline-none" placeholder="VD: 2x - y >= 0">
                        ${deleteBtnHtml}
                    </div>
                    
                    <div class="w-full md:w-1/2">
                        <div id="eqValid_${index}" class="w-full h-[46px] flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-slate-400 overflow-hidden transition-colors shadow-sm">
                            <span class="truncate text-sm font-medium">Chưa nhập liệu</span>
                        </div>
                    </div>
                `;
                inputsContainer.appendChild(row);
            });
            
            updateSystem();
        }

        window.handleInputChage = function(index) {
            equationsData[index] = document.getElementById(`eqInput_${index}`).value;
            updateSystem();
        }

        window.removeEquation = function(index) {
            equationsData.splice(index, 1);
            renderInputRows();
        }

        document.getElementById('addEqBtn').addEventListener('click', () => {
            equationsData.push(""); 
            renderInputRows();
            setTimeout(() => {
                const newIdx = equationsData.length - 1;
                const input = document.getElementById(`eqInput_${newIdx}`);
                if (input) input.focus();
            }, 50);
        });

        // --- THU GỌN / MỞ RỘNG PANEL ---
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const toggleIcon = document.getElementById('toggleIcon');
        const panelWrapper = document.getElementById('dataPanelWrapper');
        let isCollapsed = false;
        
        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                panelWrapper.classList.add('collapsed');
                toggleText.textContent = "Mở rộng";
                toggleIcon.style.transform = 'rotate(-180deg)';
            } else {
                panelWrapper.classList.remove('collapsed');
                toggleText.textContent = "Thu gọn";
                toggleIcon.style.transform = 'rotate(0deg)';
            }
        });

        // --- CÁC HÀM TOÁN HỌC & CANVAS TIỆN ÍCH ---
        function mathToPxX(x) { return (W / 2 + offsetX) + x * scale; }
        function mathToPxY(y) { return (H / 2 + offsetY) - y * scale; } 
        function pxToMathX(px) { return (px - (W / 2 + offsetX)) / scale; }
        function pxToMathY(py) { return ((H / 2 + offsetY) - py) / scale; }

        // Parser an toàn
        function parseEqStr(str, idx) {
            try {
                str = str.replace(/\s+/g, ''); 
                if (!str) return null;
                
                const match = str.match(/(.*?)(<=|>=|<|>)(.*)/);
                if (!match) return null;
                let op = match[2];
                
                function parseSide(s) {
                    let a = 0, b = 0, c = 0;
                    if (!s) return {a, b, c};
                    let terms = s.replace(/-/g, '+-').split('+');
                    for (let t of terms) {
                        if (!t) continue;
                        if (t.includes('x')) {
                            let val = t.replace('x', '');
                            a += (val === '' || val === '+') ? 1 : (val === '-') ? -1 : (parseFloat(val) || 0);
                        } else if (t.includes('y')) {
                            let val = t.replace('y', '');
                            b += (val === '' || val === '+') ? 1 : (val === '-') ? -1 : (parseFloat(val) || 0);
                        } else {
                            c += (parseFloat(t) || 0);
                        }
                    }
                    return { a, b, c };
                }
                
                let lhs = parseSide(match[1]);
                let rhs = parseSide(match[3]);
                
                let A = lhs.a - rhs.a;
                let B = lhs.b - rhs.b;
                let C = lhs.c - rhs.c;

                if (Math.abs(A) < 1e-9 && Math.abs(B) < 1e-9) return null;
                return { A, B, C, op, idx };
            } catch (e) {
                return null; // Bỏ qua nếu lỗi
            }
        }

        function calculateSystem() {
            parsedEquations = [];
            equationsData.forEach((str, i) => {
                let eq = parseEqStr(str, i);
                if (eq) parsedEquations.push(eq);
            });
            
            intersections = [];
            for (let i = 0; i < parsedEquations.length; i++) {
                for (let j = i + 1; j < parsedEquations.length; j++) {
                    let eq1 = parsedEquations[i], eq2 = parsedEquations[j];
                    let D = eq1.A * eq2.B - eq2.A * eq1.B;
                    let Dx = (-eq1.C) * eq2.B - (-eq2.C) * eq1.B;
                    let Dy = eq1.A * (-eq2.C) - eq2.A * (-eq1.C);
                    
                    if (Math.abs(D) > 1e-9) { 
                        let ix = Dx / D, iy = Dy / D;
                        let isDup = intersections.some(pt => Math.hypot(pt.x - ix, pt.y - iy) < 1e-4);
                        if (!isDup) intersections.push({x: ix, y: iy});
                    }
                }
            }
        }

        // Tạo Pattern gạch sọc Offscreen (Hỗ trợ thay đổi độ đậm nhạt)
        function initHatching() {
            hatchPatterns = [];
            const dpr = window.devicePixelRatio || 1;
            
            lineColors.forEach(color => {
                const pc = document.createElement('canvas');
                const step = 6; // Khoảng cách giữa các nét gạch cố định
                pc.width = step * dpr; 
                pc.height = step * dpr; 
                const pCtx = pc.getContext('2d');
                
                pCtx.scale(dpr, dpr);
                pCtx.strokeStyle = color;
                pCtx.lineWidth = hatchWeight; // Sử dụng biến state độ đậm
                
                pCtx.beginPath();
                pCtx.moveTo(0, 0); 
                pCtx.lineTo(step, 0);
                pCtx.stroke();
                
                const pat = ctx.createPattern(pc, 'repeat');
                if (window.DOMMatrix) pat.setTransform(new DOMMatrix().scale(1/dpr, 1/dpr));
                hatchPatterns.push(pat);
            });
        }

        // --- VẼ ĐỒ THỊ ---
        function drawCanvas() {
            if (hatchPatterns.length === 0) initHatching();
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);
            
            let startX = Math.floor(pxToMathX(0));
            let endX = Math.ceil(pxToMathX(W));
            let startY = Math.floor(pxToMathY(H));
            let endY = Math.ceil(pxToMathY(0));  
            
            // Vẽ Lưới mờ
            ctx.strokeStyle = '#e2e8f0'; 
            ctx.lineWidth = 1;
            ctx.beginPath();
            for(let i = startX; i <= endX; i++) { 
                let px = mathToPxX(i); 
                ctx.moveTo(px, 0); ctx.lineTo(px, H); 
            }
            for(let i = startY; i <= endY; i++) { 
                let py = mathToPxY(i); 
                ctx.moveTo(0, py); ctx.lineTo(W, py); 
            }
            ctx.stroke();

            // Vẽ Trục Tọa Độ
            ctx.strokeStyle = '#1e293b'; 
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            let ox = mathToPxX(0), oy = mathToPxY(0);
            if (ox > 0 && ox < W) { ctx.moveTo(ox, 0); ctx.lineTo(ox, H); }
            if (oy > 0 && oy < H) { ctx.moveTo(0, oy); ctx.lineTo(W, oy); }
            ctx.stroke();

            // Nhãn số trên trục
            ctx.fillStyle = '#1e293b';
            ctx.font = `600 ${canvasFontSize}px Inter`; 
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for(let i = startX; i <= endX; i++) {
                if(i === 0) continue;
                let px = mathToPxX(i);
                if (px > 0 && px < W && oy > 0 && oy < H) {
                    ctx.fillText(i, px, oy + canvasFontSize + 4);
                    ctx.beginPath(); ctx.moveTo(px, oy-4); ctx.lineTo(px, oy+4); ctx.stroke();
                }
            }
            for(let i = startY; i <= endY; i++) {
                if(i === 0) continue;
                let py = mathToPxY(i);
                if (py > 0 && py < H && ox > 0 && ox < W) {
                    ctx.fillText(i, ox - canvasFontSize - 6, py);
                    ctx.beginPath(); ctx.moveTo(ox-4, py); ctx.lineTo(ox+4, py); ctx.stroke();
                }
            }

            // Gốc O và Tên trục
            if (ox > -50 && ox < W+50 && oy > -50 && oy < H+50) {
                ctx.fillStyle = '#0f172a';
                ctx.font = `800 ${canvasFontSize + 2}px Inter`;
                ctx.fillText('O', ox - (canvasFontSize + 2), oy + (canvasFontSize + 2));
                
                ctx.beginPath(); ctx.moveTo(ox-6, 12); ctx.lineTo(ox, 0); ctx.lineTo(ox+6, 12); ctx.fill();
                ctx.fillText('y', ox + (canvasFontSize + 4), canvasFontSize + 4);
                
                ctx.beginPath(); ctx.moveTo(W-12, oy-6); ctx.lineTo(W, oy); ctx.lineTo(W-12, oy+6); ctx.fill();
                ctx.fillText('x', W - (canvasFontSize + 4), oy + (canvasFontSize + 6));
            }

            // Vẽ Bất Phương Trình
            parsedEquations.forEach(eq => {
                let { A, B, C, op, idx } = eq;
                const FAR = 10000;
                let p1, p2;
                if (Math.abs(B) > 1e-7) {
                    p1 = { x: -FAR, y: (-C - A * (-FAR)) / B };
                    p2 = { x: FAR, y: (-C - A * FAR) / B };
                } else {
                    p1 = { x: -C / A, y: -FAR };
                    p2 = { x: -C / A, y: FAR };
                }

                // Hướng pháp tuyến trỏ về phía SAI (để gạch bỏ)
                let nx = A, ny = B;
                if (op === '<=' || op === '<') { nx = A; ny = B; } 
                else { nx = -A; ny = -B; } 
                
                let len = Math.hypot(nx, ny);
                nx /= len; ny /= len;

                let p3 = { x: p2.x + nx * FAR, y: p2.y + ny * FAR };
                let p4 = { x: p1.x + nx * FAR, y: p1.y + ny * FAR };

                // Tô gạch sọc
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(mathToPxX(p1.x), mathToPxY(p1.y));
                ctx.lineTo(mathToPxX(p2.x), mathToPxY(p2.y));
                ctx.lineTo(mathToPxX(p3.x), mathToPxY(p3.y));
                ctx.lineTo(mathToPxX(p4.x), mathToPxY(p4.y));
                ctx.closePath();
                ctx.clip(); 

                ctx.fillStyle = hatchPatterns[idx % hatchPatterns.length];
                ctx.translate(W/2 + offsetX, H/2 + offsetY);
                let angle = (idx * 30 + 45) * Math.PI / 180; 
                ctx.rotate(angle);
                let diag = Math.hypot(W, H) * 2;
                ctx.fillRect(-diag, -diag, diag*2, diag*2); 
                ctx.restore(); 

                // Vẽ Nét ranh giới
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(mathToPxX(p1.x), mathToPxY(p1.y));
                ctx.lineTo(mathToPxX(p2.x), mathToPxY(p2.y));
                if (op === '<' || op === '>') ctx.setLineDash([12, 10]); 
                
                ctx.strokeStyle = lineColors[idx % lineColors.length];
                ctx.lineWidth = 2.5;
                ctx.stroke();
                ctx.restore();
            });

            // Vẽ Giao Điểm
            ctx.textBaseline = 'bottom';
            intersections.forEach(pt => {
                let px = mathToPxX(pt.x), py = mathToPxY(pt.y);
                if (px < -30 || px > W + 30 || py < -30 || py > H + 30) return;

                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2);
                ctx.fillStyle = '#0f172a'; ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();

                let txt = `(${parseFloat(pt.x.toFixed(2))}, ${parseFloat(pt.y.toFixed(2))})`;
                ctx.font = `600 ${canvasFontSize}px Inter`;
                ctx.textAlign = pt.x >= 0 ? 'right' : 'left';
                let off = pt.x >= 0 ? -8 : 8;
                
                ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.strokeText(txt, px + off, py - 6);
                ctx.fillStyle = '#0f172a';
                ctx.fillText(txt, px + off, py - 6);
            });

            // Vẽ Điểm M
            let mx = mathToPxX(pointM.x), my = mathToPxY(pointM.y);
            ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444'; 
            ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();

            ctx.font = `800 ${canvasFontSize + 2}px Inter`;
            ctx.textAlign = 'left';
            let mTxt = `M(${parseFloat(pointM.x.toFixed(1))}, ${parseFloat(pointM.y.toFixed(1))})`;
            ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,0.9)';
            ctx.strokeText(mTxt, mx + 12, my - 8);
            ctx.fillStyle = '#b91c1c';
            ctx.fillText(mTxt, mx + 12, my - 8);
        }

        // --- VALIDATION TRỰC TIẾP ---
        function updateValidationBoxes() {
            equationsData.forEach((str, i) => {
                let box = document.getElementById(`eqValid_${i}`);
                if (!box) return;
                
                str = str.trim();
                if (!str) {
                    box.innerHTML = `<span class="truncate text-sm font-medium">Chưa nhập liệu</span>`;
                    box.className = "w-full h-[46px] flex items-center justify-between bg-slate-50 border border-slate-200 rounded-lg px-4 py-2 text-slate-400 overflow-hidden";
                    return;
                }

                let eq = parsedEquations.find(e => e.idx === i);
                if (!eq) {
                    box.innerHTML = `<span class="text-rose-500 font-bold text-sm">Lỗi cú pháp</span>`;
                    box.className = "w-full h-[46px] flex items-center bg-rose-50 border border-rose-200 rounded-lg px-4 py-2 overflow-hidden";
                    return; 
                }

                let val = eq.A * pointM.x + eq.B * pointM.y + eq.C;
                let valid = false;
                const eps = 1e-6; // Sai số
                if (eq.op === '<=') valid = val <= eps;
                if (eq.op === '>=') valid = val >= -eps;
                if (eq.op === '<') valid = val < -eps;
                if (eq.op === '>') valid = val > eps;

                let escOp = eq.op.replace('<', '&lt;').replace('>', '&gt;');
                
                let expr = "";
                if (eq.A !== 0) expr += `${parseFloat(eq.A.toFixed(2))}(<b class="text-slate-800">${parseFloat(pointM.x.toFixed(1))}</b>) `;
                if (eq.B !== 0) {
                    let sign = eq.B > 0 ? '+' : '-';
                    expr += expr ? ` ${sign} ` : (eq.B < 0 ? "-" : "");
                    expr += `${Math.abs(parseFloat(eq.B.toFixed(2)))}(<b class="text-slate-800">${parseFloat(pointM.y.toFixed(1))}</b>) `;
                }
                if (eq.C !== 0) {
                    let sign = eq.C > 0 ? '+' : '-';
                    expr += expr ? ` ${sign} ` : (eq.C < 0 ? "-" : "");
                    expr += `${Math.abs(parseFloat(eq.C.toFixed(2)))} `;
                }
                if (!expr) expr = "0 ";

                let icon = valid 
                    ? `<div class="text-emerald-600 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg></div>`
                    : `<div class="text-rose-600 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"></path></svg></div>`;

                box.innerHTML = `
                    <div class="truncate text-slate-600 font-mono pr-2 text-xs sm:text-sm">
                        ${expr} = <strong class="text-slate-900">${parseFloat(val.toFixed(2))}</strong> 
                        <span class="text-blue-600 font-black px-1">${escOp}</span> 0
                    </div>
                    ${icon}
                `;
                
                box.className = valid
                    ? "w-full h-[46px] flex items-center justify-between bg-emerald-50 border border-emerald-300 rounded-lg px-4 py-2 overflow-hidden shadow-sm transition-colors"
                    : "w-full h-[46px] flex items-center justify-between bg-rose-50 border border-rose-300 rounded-lg px-4 py-2 overflow-hidden shadow-sm transition-colors";
            });
        }

        function updateSystem() {
            calculateSystem();
            drawCanvas();
            updateValidationBoxes();
        }

        // --- TOOLBAR & EVENT LISTENERS ---
        const btnPointer = document.getElementById('toolPointerBtn');
        const btnPan = document.getElementById('toolPanBtn');
        
        btnPointer.addEventListener('click', () => {
            currentMode = 'POINTER';
            btnPointer.classList.add('active'); btnPan.classList.remove('active');
            canvas.style.cursor = 'crosshair';
        });
        btnPan.addEventListener('click', () => {
            currentMode = 'PAN';
            btnPan.classList.add('active'); btnPointer.classList.remove('active');
            canvas.style.cursor = 'grab';
        });

        document.getElementById('zoomInBtn').addEventListener('click', () => { scale *= 1.2; drawCanvas(); });
        document.getElementById('zoomOutBtn').addEventListener('click', () => { scale /= 1.2; drawCanvas(); });

        document.getElementById('fontSlider').addEventListener('input', (e) => {
            canvasFontSize = parseInt(e.target.value);
            drawCanvas();
        });

        document.getElementById('hatchSlider').addEventListener('input', (e) => {
            hatchWeight = parseFloat(e.target.value);
            initHatching(); // Reset pattern với độ đậm mới
            drawCanvas();
        });

        // Xử lý Resize Canvas tự động theo 16:9 
        function handleResize() {
            const wrapper = canvas.parentElement;
            const rect = wrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            W = rect.width * dpr;
            H = rect.height * dpr;
            canvas.width = W;
            canvas.height = H;
            
            if(hatchPatterns.length > 0) initHatching(); 
            drawCanvas();
        }
        
        const ro = new ResizeObserver(handleResize);
        ro.observe(canvas.parentElement);

        // Kéo thả & Pan
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            let cx = e.clientX, cy = e.clientY;
            if (e.touches && e.touches.length > 0) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
            return { x: (cx - rect.left) * dpr, y: (cy - rect.top) * dpr };
        }

        function onPointerDown(e) {
            isDragging = true;
            lastMouse = getEventPos(e);
            
            if (currentMode === 'POINTER') {
                const px = mathToPxX(pointM.x), py = mathToPxY(pointM.y);
                // Hitbox của điểm M
                if (Math.hypot(lastMouse.x - px, lastMouse.y - py) > 40) isDragging = false; 
            } else {
                canvas.style.cursor = 'grabbing';
            }
        }

        function onPointerMove(e) {
            if (!isDragging) {
                if (currentMode === 'POINTER') {
                    const pos = getEventPos(e);
                    const px = mathToPxX(pointM.x), py = mathToPxY(pointM.y);
                    canvas.style.cursor = (Math.hypot(pos.x - px, pos.y - py) < 40) ? 'pointer' : 'crosshair';
                }
                return;
            }
            
            const pos = getEventPos(e);
            if (currentMode === 'PAN') {
                offsetX += (pos.x - lastMouse.x);
                offsetY += (pos.y - lastMouse.y);
                drawCanvas();
            } else if (currentMode === 'POINTER') {
                pointM.x = pxToMathX(pos.x);
                pointM.y = pxToMathY(pos.y);
                drawCanvas();
                updateValidationBoxes(); 
            }
            lastMouse = pos;
        }

        function onPointerUp() {
            isDragging = false;
            canvas.style.cursor = currentMode === 'PAN' ? 'grab' : 'crosshair';
        }

        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive: true});
        window.addEventListener('touchmove', onPointerMove, {passive: true});
        window.addEventListener('touchend', onPointerUp);

        // --- KHỞI CHẠY LẦN ĐẦU ---
        window.onload = () => {
            renderInputRows(); 
            handleResize(); 
        };
    </script>
</body>
